    <h1 class="quote-title">一言</h1>
    <p class="lead" id="lead">Zephyr, Yore, Xanadu.<br>「晚风，往昔，世外幻境。」</p>
    <script>
    /* 首页介绍语：
       ① 进页面立刻显示你自己写的那两句之一（零等待、不与上次重复）；
       ② 同时向「一言」取一句名人名言（哲学分类），取到就淡入替换；
       ③ 3.5 秒取不到就保持①那句。
       想改句子，直接改 LOCAL 数组。 */
    (function () {
      var LOCAL = [
        'Cultivate Justice, Lead Upright.<br>「精思致远，量守本心」',
        'Zephyr, Yore, Xanadu.<br>「晚风，往昔，世外幻境。」'
      ];
      var el = document.getElementById('lead');
      if (!el) return;

      function esc(v) {
        return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function plain(x) { return String(x).replace(/<[^>]*>/g, ' '); }
      function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      function show(html) {
        save('astra_quote_text', plain(html));
        el.style.transition = 'opacity .35s';
        el.style.opacity = '0';
        setTimeout(function () { el.innerHTML = html; el.style.opacity = '1'; }, 360);
      }

      /* ① 立刻显示本地那句 */
      var last = read('astra_quote_text'), i = 0;
      if (LOCAL.length > 1) {
        do { i = Math.floor(Math.random() * LOCAL.length); } while (plain(LOCAL[i]) === last);
      }
      el.innerHTML = LOCAL[i];
      save('astra_quote_text', plain(LOCAL[i]));

      /* ② 取名人名言，取不到就保持本地那句 */
      if (!window.fetch || !window.AbortController) return;
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, 3500);
      fetch('https://v1.hitokoto.cn/?encode=json&c=k&_=' + Date.now(), { signal: ctl.signal })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          clearTimeout(timer);
          if (!d || !d.hitokoto) return;
          var from = [d.from_who, d.from].filter(Boolean).join(' · ');
          show(esc(d.hitokoto) + (from ? '<br>—— ' + esc(from) : ''));
        })
        .catch(function () { clearTimeout(timer); });
    })();
    </script>
