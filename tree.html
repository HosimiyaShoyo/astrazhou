<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra 邀请你上他的圣诞树 🎄 你能爬多高？</title>
<meta name="description" content="10 道关于 Astra 的题。猜中他的答案，一路爬到他的树顶 ✨">
<meta property="og:type" content="website">
<meta property="og:title" content="Astra 邀请你上他的圣诞树 🎄">
<meta property="og:description" content="10 道关于 Astra 的题。猜中他的答案，一路爬到他的树顶 ✨">
<meta property="og:image" content="https://astrazhou.is-cool.dev/assets/og-cover.jpg">
<meta property="og:url" content="https://astrazhou.is-cool.dev/tree.html">
<meta name="theme-color" content="#1F2B4D">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101B36}
body{
  font-family:'Baloo 2',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-weight:800;color:#fff;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(130% 75% at 50% 105%,#3A4B7E 0%,#1F2B4D 45%,#101B36 100%);
  position:relative;
}
/* ===== 星空 & 雪 ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* ===== 顶部 ===== */
.top{position:relative;z-index:5;width:100%;max-width:520px;padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:18px}
.back:active{transform:scale(.94)}
.title{font-size:15px;line-height:1.3;-webkit-text-stroke:3px #23222B;paint-order:stroke fill;color:#FFD34D}

/* ===== 场景区（树）===== */
.stage{position:relative;z-index:3;flex:1;width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}

.tree{position:relative;width:min(78vw,320px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.tiers{display:flex;flex-direction:column;align-items:center;width:100%}
.tier{
  width:100%;height:0;
  border-left-style:solid;border-left-color:transparent;
  border-right-style:solid;border-right-color:transparent;
  border-bottom-style:solid;
  margin-top:-14px;
  position:relative;
  transition:transform .45s cubic-bezier(.22,.61,.36,1), filter .45s, border-bottom-color .45s;
}
.tier:nth-child(odd){--c1:#1E7A55;--c2:#175E42}
.tier:nth-child(even){--c1:#248F63;--c2:#1B6E4E}
.tier.lit{border-bottom-color:var(--c1);filter:drop-shadow(0 0 14px rgba(127,209,174,.85))}
.tier.dim{border-bottom-color:#2A3D5C;filter:none;opacity:.55}
.tier:first-child{margin-top:0}
/* 树顶星星 */
.star-top{font-size:34px;line-height:1;margin-bottom:-8px;filter:drop-shadow(0 0 12px #FFD34D);transition:transform .5s,filter .5s}
.star-top.on{transform:scale(1.35) rotate(12deg);filter:drop-shadow(0 0 22px #FFD34D)}
/* 树干 */
.trunk{width:16%;height:22px;background:linear-gradient(#5B3A22,#3E2716);border-radius:3px}
/* 小人（爬树者） */
.climber{position:absolute;left:50%;bottom:0;font-size:26px;transform:translate(-50%,0);transition:bottom .5s cubic-bezier(.34,1.56,.64,1);z-index:4;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}

/* ===== 底部答题卡 ===== */
.panel{
  position:relative;z-index:6;width:100%;max-width:520px;padding:0 14px 18px;
}
.card{
  background:rgba(255,255,255,.97);color:#1F2B4D;border-radius:22px;
  padding:16px 16px 14px;box-shadow:0 12px 34px rgba(0,0,0,.42);
  border:3px solid #23222B;
}
.qnum{font-size:12px;color:#6C7BA6;letter-spacing:.08em}
.qtext{font-size:17px;line-height:1.45;margin:6px 0 12px;font-weight:800;color:#1F2B4D}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:14px;
  background:#F1F4FB;border:2px solid #D9E1F2;color:#1F2B4D;cursor:pointer;
  transition:transform .12s,background .2s,border-color .2s;font-weight:700;
}
.opt:active{transform:scale(.98)}
.opt:hover{border-color:#7FA6E8}
.opt.ok{background:#D8F3E4;border-color:#2BA96C;color:#0E5C38}
.opt.no{background:#FDDCDC;border-color:#E8423F;color:#8C1D1B}
.opt[disabled]{cursor:default;opacity:.75}
.opt.ok[disabled],.opt.no[disabled]{opacity:1}
.tip{margin-top:10px;font-size:13px;color:#6C7BA6;line-height:1.5;min-height:1em}

/* ===== 结果页 ===== */
.result{text-align:center;padding:8px 0 4px}
.result h2{margin:0 0 6px;font-size:22px;color:#1F2B4D}
.result .score{font-size:42px;color:#E8423F;line-height:1.1;margin:4px 0}
.result p{margin:6px 0 0;font-size:14px;color:#5B6A93;line-height:1.6}
.btn{
  display:inline-block;margin-top:14px;padding:12px 26px;border-radius:999px;border:none;
  font:inherit;font-size:15px;font-weight:800;color:#23222B;background:#FFD34D;
  box-shadow:0 5px 0 #C9A000;cursor:pointer;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C9A000}
.btn.ghost{background:#E7EDF9;color:#1F2B4D;box-shadow:0 5px 0 #C3CFE6;margin-left:8px}

/* ===== 开场页 ===== */
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 70% at 50% 100%,#3A4B7E,#1F2B4D 60%,#101B36);text-align:center;padding:0 22px;transition:opacity .45s}
.boot.hide{opacity:0;pointer-events:none}
.boot-top{font-size:clamp(19px,5.5vw,25px);color:#fff;-webkit-text-stroke:6px #23222B;paint-order:stroke fill;rotate:-3deg}
.boot-main{font-size:clamp(38px,12vw,56px);color:#FFD34D;-webkit-text-stroke:9px #23222B;paint-order:stroke fill;line-height:1.05}
.boot-sub{font-size:14px;color:#A9B8DC;max-width:20em;line-height:1.7;font-weight:600}
.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;border-radius:50%;background:#FFD34D;animation:bd .9s ease-in-out infinite}
.dots span:nth-child(2){background:#E8423F;animation-delay:.16s}
.dots span:nth-child(3){background:#7FD1AE;animation-delay:.32s}
@keyframes bd{0%,60%,100%{transform:none}30%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.dots span,.star{animation:none}}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<canvas id="snow"></canvas>

<div class="top">
  <a class="back" href="index.html" aria-label="返回主页">←</a>
  <div class="title" id="title">Astra 的圣诞树</div>
</div>

<div class="stage">
  <div class="tree" id="tree">
    <div class="star-top" id="starTop">⭐</div>
    <div class="tiers" id="tiers"></div>
    <div class="trunk"></div>
    <div class="climber" id="climber">🧗</div>
  </div>
</div>

<div class="panel">
  <div class="card" id="card"></div>
</div>

<div class="boot" id="boot">
  <div class="boot-top">我的圣诞树上</div>
  <div class="boot-main">你在哪儿？</div>
  <div class="boot-sub" id="bootSub">10 道关于 Astra 的题<br>猜中他的答案，一路爬到他的树顶 ✨</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <button class="btn" id="startBtn" style="margin-top:6px">开始爬树</button>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     ① 题目 —— 全部可改。把 q 改成你的题、opts 改成选项、
        ans 填正确选项的下标（从 0 开始）
     ========================================================== */
  var QUESTIONS = [
    { q: 'Astra 的博客用的是什么配色？', opts: ['大红大紫', '薄荷绿液态玻璃', '纯黑', '赛博朋克霓虹'], ans: 1,
      tip: '点开他的博客一眼就知道 🍃' },
    { q: 'Astra 在读的学校是？', opts: ['浙江大学', '中国计量大学', '杭州电子科技大学', '浙江工业大学'], ans: 1,
      tip: '「精思国计，细量民生」' },
    { q: '他文章里的诗用了哪种字体？', opts: ['黑体', '楷体', '瘦金体', '甲骨文'], ans: 2,
      tip: '那种笔画细如发丝的宋徽宗字体' },
    { q: '他的博客里没有下面哪个小游戏？', opts: ['PONG', 'DOOM', '超级马里奥', '俄罗斯方块'], ans: 3,
      tip: '去「小游戏」页面数一数' },
    { q: 'Astra 的博客域名后缀是？', opts: ['.com', '.cn', '.is-cool.dev', '.io'], ans: 2,
      tip: '一个免费子域名' },
    { q: '他写过的短篇小说的主角是？', opts: ['一只松鼠', '一条鲸鱼', '一只猫', '一匹马'], ans: 0,
      tip: '《月光下的松鼠》🐿️' },
    { q: '他的博客没有下面哪个板块？', opts: ['文章', '树洞', '相册', '关于'], ans: 2,
      tip: '首页四个按钮里找' },
    { q: 'Astra 的校训是？', opts: ['求是创新', '精思国计 细量民生', '厚德载物', '博学笃行'], ans: 1,
      tip: '计量人的八个字' },
    { q: '他博客里的浏览量是哪个服务统计的？', opts: ['Google Analytics', 'abacus', '百度统计', '自己写的后端'], ans: 1,
      tip: '一个免费的计数小站' },
    { q: '给 Astra 留言的「树洞」用的什么方案？', opts: ['评论区插件', '邮件表单转发', '微信小程序', '没有树洞'], ans: 1,
      tip: '填完直接进他邮箱 📮' }
  ];

  var TOTAL = QUESTIONS.length;

  /* ==========================================================
     ② 状态
     ========================================================== */
  var idx = 0, correct = 0, answered = false;

  var $ = function (id) { return document.getElementById(id); };
  var cardEl = $('card'), tiersEl = $('tiers'), climberEl = $('climber');
  var starTopEl = $('starTop'), bootEl = $('boot'), titleEl = $('title');

  /* ==========================================================
     ③ 建树：TOTAL 层三角
     ========================================================== */
  function buildTree() {
    tiersEl.innerHTML = '';
    for (var i = TOTAL - 1; i >= 0; i--) {
      var t = document.createElement('div');
      t.className = 'tier dim';
      // 越往上越窄
      var p = (TOTAL - 1 - i) / Math.max(1, TOTAL - 1);  // 0(底) → 1(顶)
      var w = 100 - p * 62;
      var h = Math.max(20, 34 - p * 10);
      t.style.borderLeftWidth = (w / 2) + '%';
      t.style.borderRightWidth = (w / 2) + '%';
      t.style.borderBottomWidth = h + 'px';
      t.dataset.i = i;
      tiersEl.appendChild(t);
    }
  }

  /* 点亮第 n 层（从底部数），并移动小人 */
  function climb(n) {
    var tiers = tiersEl.children;
    // 从底部往上数 n 层点亮
    for (var k = 0; k < tiers.length; k++) {
      var bottomIdx = tiers.length - 1 - k;   // 底部是最后一个元素
      tiers[bottomIdx].classList.toggle('lit', k < n);
      tiers[bottomIdx].classList.toggle('dim', k >= n);
    }
    var tree = $('tree');
    var treeH = tree.clientHeight;
    var ratio = n / TOTAL;
    climberEl.style.bottom = Math.round(ratio * (treeH - 40)) + 'px';
    starTopEl.classList.toggle('on', n >= TOTAL);
    titleEl.textContent = n >= TOTAL ? '你爬到树顶了 🎉' : 'Astra 的圣诞树 ' + n + '/' + TOTAL;
  }

  /* ==========================================================
     ④ 答题
     ========================================================== */
  function render() {
    answered = false;
    if (idx >= TOTAL) return renderResult();
    var q = QUESTIONS[idx];
    var html = '<div class="qnum">第 ' + (idx + 1) + ' / ' + TOTAL + ' 题</div>';
    html += '<div class="qtext">' + esc(q.q) + '</div><div class="opts">';
    q.opts.forEach(function (o, i) {
      html += '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>';
    });
    html += '</div><div class="tip" id="tip"></div>';
    cardEl.innerHTML = html;

    var btns = cardEl.querySelectorAll('.opt');
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener('click', function () { pick(parseInt(b.getAttribute('data-i'), 10)); });
    });
  }

  function pick(i) {
    if (answered) return;
    answered = true;
    var q = QUESTIONS[idx];
    var btns = cardEl.querySelectorAll('.opt');
    var ok = (i === q.ans);

    Array.prototype.forEach.call(btns, function (b, k) {
      b.disabled = true;
      if (k === q.ans) b.classList.add('ok');
      else if (k === i) b.classList.add('no');
    });

    var tip = $('tip');
    if (ok) {
      correct++;
      climb(correct);
      tip.textContent = '✅ 答对了！往上爬一层' + (q.tip ? '　· ' + q.tip : '');
    } else {
      tip.textContent = '❌ 答错了，正确答案是「' + q.opts[q.ans] + '」' + (q.tip ? '　· ' + q.tip : '');
    }

    setTimeout(function () {
      idx++;
      render();
    }, ok ? 950 : 1500);
  }

  /* ==========================================================
     ⑤ 结果
     ========================================================== */
  function renderResult() {
    var tier = correct === TOTAL ? '🏆 登顶！' : (correct >= 7 ? '🌟 快到了' : (correct >= 4 ? '🌿 爬到一半' : '🌱 刚起步'));
    var word = correct === TOTAL ? '你比我本人还了解我。' :
               (correct >= 7 ? '很了解我了，剩下几道我认输。' :
               (correct >= 4 ? '还算熟，下次多聊两句。' : '看来我们还不算太熟 😄'));
    cardEl.innerHTML =
      '<div class="result">' +
      '<h2>' + tier + '</h2>' +
      '<div class="score">' + correct + ' / ' + TOTAL + '</div>' +
      '<p>' + word + '</p>' +
      '<button class="btn" id="again">再爬一次</button>' +
      '</div>';
    $('again').addEventListener('click', restart);
    climberEl.textContent = correct === TOTAL ? '🎅' : '🧗';
  }

  function restart() {
    idx = 0; correct = 0; answered = false;
    climberEl.textContent = '🧗';
    climb(0);
    render();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ==========================================================
     ⑥ 星空 + 雪
     ========================================================== */
  var sky = $('sky'), snow = $('snow');
  var sctx = sky.getContext('2d'), wctx = snow.getContext('2d');
  var stars = [], flakes = [];

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    [sky, snow].forEach(function (c) {
      c.width = innerWidth * dpr;
      c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    stars = [];
    for (var i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * 0.7,
        r: Math.random() * 1.6 + 0.4, p: Math.random() * Math.PI * 2, s: Math.random() * 0.02 + 0.008 });
    }
    flakes = [];
    for (var j = 0; j < 60; j++) {
      flakes.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 2.2 + 0.8, vy: Math.random() * 0.6 + 0.25, vx: (Math.random() - 0.5) * 0.3,
        a: Math.random() * 0.5 + 0.35 });
    }
  }

  function loop() {
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.p += s.s;
      sctx.globalAlpha = 0.3 + Math.abs(Math.sin(s.p)) * 0.7;
      sctx.fillStyle = '#fff';
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, 6.283);
      sctx.fill();
    }
    sctx.globalAlpha = 1;

    wctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var j = 0; j < flakes.length; j++) {
      var f = flakes[j];
      f.y += f.vy; f.x += f.vx;
      if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
      if (f.x < -5) f.x = innerWidth + 5;
      if (f.x > innerWidth + 5) f.x = -5;
      wctx.globalAlpha = f.a;
      wctx.fillStyle = '#fff';
      wctx.beginPath();
      wctx.arc(f.x, f.y, f.r, 0, 6.283);
      wctx.fill();
    }
    wctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  /* ==========================================================
     ⑦ 启动
     ========================================================== */
  buildTree();
  climb(0);
  resize();
  addEventListener('resize', function () { resize(); climb(correct); });
  requestAnimationFrame(loop);

  $('startBtn').addEventListener('click', function () {
    bootEl.classList.add('hide');
    setTimeout(function () { render(); }, 260);
  });

  /* 桌面端直接进入（开场页也可以留着等点击） */
  render();
  cardEl.style.visibility = 'hidden';
  setTimeout(function () { cardEl.style.visibility = 'visible'; }, 10);
})();
</script>
</body>
</html>
