<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>超级马里奥 · Astra Zhou</title>
<meta name="description" content="原版《超级马里奥兄弟》NES 游戏，浏览器里直接玩。">
<meta property="og:type" content="website">
<meta property="og:title" content="超级马里奥 · Astra Zhou">
<meta property="og:description" content="原版《超级马里奥兄弟》NES 游戏，浏览器里直接玩。">
<meta property="og:image" content="https://hosimiyashoyo.github.io/astrazhou/assets/og-cover.jpg">
<meta property="og:url" content="https://hosimiyashoyo.github.io/astrazhou/mario.html">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css?v=">
<style>
  .nes-wrap { margin: 1.3rem 0 0; }
  #game {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 32px rgba(20, 40, 10, .18);
    overflow: hidden;
  }
  #game canvas { display: block; width: 100% !important; height: 100% !important; }
  .ver {
    display: flex; flex-wrap: wrap; gap: .45rem;
    margin: 0 0 1rem;
  }
  .ver button {
    font: inherit; font-size: .88rem; padding: .42rem .95rem;
    border-radius: 999px; color: var(--muted);
    background: var(--glass-bg-2); border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi);
    -webkit-backdrop-filter: var(--blur-2); backdrop-filter: var(--blur-2);
    cursor: pointer; transition: color .2s, border-color .2s;
  }
  .ver button.on, .ver button:hover { color: var(--accent); border-color: var(--accent); }
  .nes-tip { font-size: .82rem; color: var(--muted); line-height: 1.8; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="back-home" href="index.html" aria-label="返回主页">←</a>
    <a class="brand" href="index.html"><img class="avatar" src="assets/avatar.jpg" alt="" width="30" height="30">Astra Zhou’s Blog</a>
    <img class="brand-mac" src="assets/mac-smile.png" alt="" style="width:20px;height:auto;flex:none;margin-left:.45rem;opacity:.9">
  </header>

  <main>
    <h1>超级马里奥</h1>
    <p class="lead">原版 NES《超级马里奥兄弟》，跑在开源模拟器 EmulatorJS 上。</p>

    <nav class="ver" id="ver">
      <button type="button" data-rom="s" class="on">超级马里奥兄弟</button>
      <button type="button" data-rom="l">Lost Levels</button>
      <button type="button" data-rom="2">超级马里奥 2</button>
      <button type="button" data-rom="3">超级马里奥 3</button>
    </nav>

    <div class="nes-wrap">
      <div id="game"></div>
      <p class="nes-tip">
        手机上模拟器自带虚拟手柄（左下方向、右下 A/B）。<br>
        电脑用键盘方向键 + <b>Z</b>（B 键）/ <b>X</b>（A 键），<b>回车</b>开始。
      </p>
    </div>
  </main>

  <footer class="site">© <span id="y">2025</span> Astra Zhou</footer>

</div>

<script>
document.getElementById('y').textContent = new Date().getFullYear();

(function () {
  var ROMS = {
    s: 'assets/games/super-mario-bros.nes',
    l: 'assets/games/super-mario-bros-lost-levels.nes',
    '2': 'assets/games/super-mario-bros-2.nes',
    '3': 'assets/games/super-mario-bros-3.nes'
  };

  function boot(rom) {
    var host = document.getElementById('game');
    host.innerHTML = '';
    /* EmulatorJS 用全局变量配置 */
    window.EJS_player = '#game';
    window.EJS_core = 'nes';
    window.EJS_gameUrl = ROMS[rom] || ROMS.s;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#4d7c0f';
    window.EJS_backgroundColor = '#0a0f06';
    window.EJS_lang = 'zh-CN';
    /* 每次切换都重新注入 loader */
    var old = document.getElementById('ejs-loader');
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement('script');
    s.id = 'ejs-loader';
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }

  Array.prototype.forEach.call(document.querySelectorAll('#ver button'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#ver button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      boot(b.getAttribute('data-rom'));
    });
  });

  boot('s');
})();
</script>
</body>
</html>
