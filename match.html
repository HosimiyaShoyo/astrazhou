<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>默契度大挑战 · 你的圣诞树上 </title>
<meta name="description" content="10 道题，猜中我的答案就往树上爬。看看我们能有多默契 🎄">
<meta property="og:type" content="website">
<meta property="og:title" content="默契度大挑战 · 你的圣诞树上">
<meta property="og:description" content="10 道题，猜中我的答案就往树上爬 🎄">
<meta property="og:image" content="https://astrazhou.is-cool.dev/assets/og-cover.jpg">
<meta property="og:url" content="https://astrazhou.is-cool.dev/match.html">
<meta name="theme-color" content="#101B36">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#101B36}
body{
  font-family:'Baloo 2',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-weight:700;color:#fff;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(135% 78% at 50% 108%,#3A4B7E 0%,#1F2B4D 42%,#0C1526 100%);
  position:relative;overflow:hidden;
}
#sky,#snow{position:fixed;inset:0;pointer-events:none}
#sky{z-index:0}#snow{z-index:1}

/* ===== 漂浮雪花 ===== */
.flake{position:fixed;z-index:1;pointer-events:none;animation:drift linear infinite;will-change:transform}
@keyframes drift{
  0%{transform:translate3d(0,-12vh,0) rotate(0deg)}
  100%{transform:translate3d(24px,112vh,0) rotate(360deg)}
}

/* ===== 顶部 ===== */
.top{position:relative;z-index:6;width:100%;max-width:540px;padding:13px 15px 0;display:flex;align-items:center;gap:10px;flex:none}
.back{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.24);color:#fff;text-decoration:none;font-size:17px;
  transition:transform .15s}
.back:active{transform:scale(.93)}
.title{font-size:14.5px;line-height:1.3;-webkit-text-stroke:3px #23222B;paint-order:stroke fill;color:#FFD34D;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-chip{margin-left:auto;flex:none;font-size:12px;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#DCE8FF;white-space:nowrap}

/* ===== 舞台（树） ===== */
.stage{position:relative;z-index:3;flex:1 1 auto;width:100%;max-width:540px;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;padding:4px 8px 0}
.tree-wrap{position:relative;width:min(66vw,272px);height:100%;min-height:150px;
  display:flex;align-items:flex-end;justify-content:center}
#treeSvg{width:100%;height:100%;overflow:visible;display:block}
.tier-g{transition:opacity .5s}
.tier-g .foliage{transition:fill .5s,filter .5s}
.tier-g.dim{opacity:.4}
.tier-g.dim .foliage{fill:#2A3D5C}
.tier-g.lit{filter:drop-shadow(0 0 9px rgba(127,209,174,.95))}
.tier-g.lit .foliage{fill:#248F63}
.tier-g.lit:nth-child(even) .foliage{fill:#1E7A55}
.orn{transition:opacity .55s,fill .55s}
.tier-g.dim .orn{opacity:.1}
.tier-g.lit .orn{opacity:1}
.trunk-svg{fill:#5B3A22}
#starTop{transition:transform .6s cubic-bezier(.34,1.56,.64,1),filter .6s;transform-origin:center}
#starTop.on{transform:scale(1.5) rotate(18deg);filter:drop-shadow(0 0 20px #FFD34D)}

/* 爬树小人 */
.climber{position:absolute;left:50%;bottom:0;font-size:23px;transform:translate(-50%,0);
  transition:bottom .6s cubic-bezier(.34,1.56,.64,1);z-index:4;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}

/* ===== 答题面板 ===== */
.panel{position:relative;z-index:7;width:100%;max-width:540px;flex:none;padding:0 12px 13px}
.card{
  background:rgba(255,255,255,.975);color:#1B2540;border-radius:20px;
  padding:14px 14px 12px;box-shadow:0 14px 38px rgba(0,0,0,.48),0 0 0 3px #23222B;
}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#E8EFFB;color:#4A6396;flex:none}
.bar{flex:1;height:5px;border-radius:99px;background:#E2E9F5;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4d7c0f,#7FD1AE);border-radius:99px;
  transition:width .4s cubic-bezier(.22,.61,.36,1)}
.qtext{font-size:16px;line-height:1.48;font-weight:800;margin:0 0 10px;color:#1B2540}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;font-size:14px;font-weight:700;text-align:left;padding:10px 12px;border-radius:12px;
  background:#F2F5FC;border:2px solid #DCE3F2;color:#1B2540;cursor:pointer;
  transition:transform .12s,border-color .18s,background .18s}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:#7FA6E8}
.opt.sel{border-color:#3a5f0b;background:rgba(77,124,15,.14)}
.opt.ok{border-color:#2BA96C;background:#DDF5E8;color:#0B5636}
.opt.no{border-color:#E8423F;background:#FDDCDC;color:#8A1B19}
.opt[disabled]{cursor:default}
.row{display:flex;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:14px;font-weight:800;padding:10px 20px;border-radius:999px;border:none;
  background:#4d7c0f;color:#fff;cursor:pointer;transition:transform .12s,opacity .2s;flex:1}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:#E7EDF9;color:#1B2540;box-shadow:none}

/* ===== 结果 ===== */
.result{text-align:center}
.pct{font-size:44px;line-height:1.05;font-weight:800;color:#3a5f0b;letter-spacing:-.03em}
.pct small{font-size:19px;opacity:.6}
.lv{font-size:17px;font-weight:800;margin:3px 0 2px;color:#1B2540}
.lvd{font-size:13px;color:#5B6A93;line-height:1.65}
.review{max-height:31vh;overflow-y:auto;margin-top:11px;text-align:left;
  border-top:1px dashed #D6E0F2;padding-top:9px}
.rv{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid #EEF2FA;font-size:12.5px;line-height:1.5}
.rv:last-child{border-bottom:none}
.rv .m{flex:none;font-size:13px}
.rv .t{flex:1;min-width:0;color:#1B2540}
.rv .t b{font-weight:800;display:block;margin-bottom:1px}
.rv .t span{color:#6C7BA6;font-size:11.5px;display:block}
.share-box{margin-top:11px;padding:10px;border-radius:13px;background:#EDF3E5;border:1px dashed rgba(77,124,15,.4);text-align:left}
.share-box p{margin:0 0 6px;font-size:12px;color:#43502c;font-weight:700}
.share-url{width:100%;font:inherit;font-size:11.5px;font-weight:600;padding:7px 9px;border-radius:9px;
  border:1px solid rgba(77,124,15,.3);background:#fff;color:#1B2540;word-break:break-all;
  resize:none;height:3.2rem;line-height:1.45}
.copy-tip{font-size:11.5px;color:#2BA96C;height:1em;margin-top:5px;font-weight:800}

/* ===== 开场 ===== */
.boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:15px;padding:0 24px;text-align:center;transition:opacity .45s;
  background:radial-gradient(120% 72% at 50% 100%,#3A4B7E,#1F2B4D 55%,#0C1526)}
.boot.hide{opacity:0;pointer-events:none}
.boot-logo{font-size:52px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,211,77,.4))}
.boot-top{font-size:clamp(17px,4.8vw,22px);color:#fff;-webkit-text-stroke:5px #23222B;paint-order:stroke fill;rotate:-2deg}
.boot-main{font-size:clamp(30px,9.5vw,44px);color:#FFD34D;-webkit-text-stroke:8px #23222B;paint-order:stroke fill;line-height:1.08}
.boot-sub{font-size:13px;color:#A9B8DC;max-width:21em;line-height:1.75;font-weight:600}
.mode-pick{width:100%;max-width:330px;display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mode-btn{font:inherit;text-align:left;padding:13px 15px;border-radius:15px;cursor:pointer;
  background:rgba(255,255,255,.94);border:2px solid #23222B;box-shadow:0 5px 0 #23222B;
  transition:transform .13s,box-shadow .13s}
.mode-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #23222B}
.mode-btn b{display:block;font-size:15px;color:#1B2540;margin-bottom:2px}
.mode-btn small{display:block;font-size:12px;color:#5B6A93;line-height:1.5;font-weight:600}
.dots{display:flex;gap:7px;margin-top:2px}
.dots span{width:10px;height:10px;border-radius:50%;background:#FFD34D;animation:bd .95s ease-in-out infinite}
.dots span:nth-child(2){background:#E8423F;animation-delay:.16s}
.dots span:nth-child(3){background:#7FD1AE;animation-delay:.32s}
@keyframes bd{0%,60%,100%{transform:none}30%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.dots span,.flake{animation:none}}
/* 小屏收一点 */
@media (max-height:680px){
  .panel{padding-bottom:9px}
  .card{padding:11px 12px 10px}
  .qtext{font-size:15px;margin-bottom:8px}
  .opt{font-size:13.5px;padding:9px 11px}
  .tree-wrap{width:min(54vw,214px)}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<canvas id="snow"></canvas>

<div class="top">
  <a class="back" href="index.html" aria-label="返回主页">←</a>
  <div class="title" id="title">默契度大挑战</div>
  <div class="score-chip" id="scoreChip" hidden>已爬 0 / 10</div>
</div>

<div class="stage">
  <div class="tree-wrap" id="treeWrap">
    <svg id="treeSvg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <g id="tiers"></g>
      <rect class="trunk-svg" x="90" y="238" width="20" height="20" rx="3"/>
      <g id="starTop">
        <path d="M100 2 L106 18 L124 18 L110 28 L115 45 L100 35 L85 45 L90 28 L76 18 L94 18 Z"
              fill="#FFD34D" stroke="#C9A000" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="climber" id="climber">🧗</div>
  </div>
</div>

<div class="panel"><div class="card" id="card" hidden></div></div>

<div class="boot" id="boot">
  <div class="boot-logo">🎄</div>
  <div class="boot-top">我的圣诞树上</div>
  <div class="boot-main">你在哪儿？</div>
  <div class="boot-sub" id="bootSub">10 道关于我的题<br>猜中一道，往上爬一层 🌟</div>
  <div class="mode-pick" id="modePick">
    <button class="mode-btn" id="btnCreate">
      <b>我来出题 🎅</b>
      <small>先回答 10 道题，生成链接发给朋友</small>
    </button>
  </div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     题库（40 道，4 选项）—— 随意改
     ========================================================== */
  var BANK = [
    { q: '我周末最可能在干嘛？', o: ['宅着看剧/打游戏', '出门散步骑车', '和朋友约饭', '睡到自然醒再干活'] },
    { q: '我最受不了的食物是？', o: ['香菜', '甜到齁的蛋糕', '生的海鲜', '肥肉'] },
    { q: '手机里我最常用的 App 是哪类？', o: ['社交聊天', '视频/B站', '阅读/知识', '工具/效率'] },
    { q: '只能选一个，我更想要？', o: ['很多钱', '很多时间', '被理解', '健康'] },
    { q: '我熬夜到凌晨三点，最可能是因为？', o: ['做东西/写代码', '刷视频停不下来', '看书看进去了', '和人聊天'] },
    { q: '我更喜欢什么天气？', o: ['大晴天', '下雨天', '阴天', '雪天'] },
    { q: '面对一堆快递，我会？', o: ['立刻拆完', '堆着慢慢拆', '先摆好拍照', '拆完把箱子整理好'] },
    { q: '我点奶茶会要几分甜？', o: ['全糖', '七分', '半糖', '三分或无糖'] },
    { q: '我最喜欢哪个季节？', o: ['春', '夏', '秋', '冬'] },
    { q: '遇到问题，我第一反应是？', o: ['自己先搜一下', '直接问人', '先放一放', '凭感觉试试'] },
    { q: '我更愿意在哪生活？', o: ['大城市热闹', '小城市安稳', '海边或山野', '看人，在哪都行'] },
    { q: '我买东西最看重？', o: ['便宜', '好看', '实用耐用', '品牌口碑'] },
    { q: '我的桌面大概是？', o: ['干干净净什么都没有', '堆满了东西', '分类整齐但东西多', '看心情'] },
    { q: '长途旅行我会选？', o: ['飞机快点到', '高铁看风景', '自驾自由', '火车慢慢晃'] },
    { q: '我更爱听哪种音乐？', o: ['安静民谣/纯音乐', '摇滚/电音', '说唱', '流行歌单循环'] },
    { q: '和朋友出去玩，我通常是？', o: ['安排行程的那个', '跟着走的那个', '负责拍照的', '负责找吃的'] },
    { q: '我最不擅长？', o: ['当众讲话', '拒绝别人', '早睡', '记人名'] },
    { q: '收到别人消息，我会？', o: ['立刻回', '想好了再回', '看到忘记回', '看心情'] },
    { q: '我更怕？', o: ['孤独', '平庸', '失去自由', '让人失望'] },
    { q: '我喜欢的花是？', o: ['桂花', '向日葵', '玫瑰', '樱花'] },
    { q: '我写东西的时候？', o: ['一口气写完', '写一点放一放', '先列大纲', '想到哪写到哪'] },
    { q: '我更愿意把时间花在？', o: ['学新东西', '打磨已有的事', '陪人', '自己待着'] },
    { q: '我最喜欢的数字？', o: ['7', '3', '1', '没有偏好'] },
    { q: '看电影我最受不了？', o: ['烂尾', '太拖沓', '太吵', '强行煽情'] },
    { q: '我的作息？', o: ['早睡早起', '晚睡晚起', '很不规律', '看情况'] },
    { q: '中了一笔钱，我会先？', o: ['存起来', '买一直想要的', '去旅行', '给家人'] },
    { q: '我更愿意什么时间干活？', o: ['清晨', '下午', '深夜', '什么时候都行'] },
    { q: '我更喜欢哪种交流？', o: ['打字', '语音', '打电话', '见面说'] },
    { q: '我身边一定会有？', o: ['水杯', '耳机', '笔记本', '手机充电线'] },
    { q: '我对陌生人的第一印象看重？', o: ['说话方式', '穿着打扮', '眼神', '做事态度'] },
    { q: '我更能接受哪种失败？', o: ['努力了没成', '根本没试', '被人拖累', '运气不好'] },
    { q: '我最想去？', o: ['日本', '欧洲', '新疆西藏', '海边小岛'] },
    { q: '我平时看的资讯偏？', o: ['科技数码', '社会新闻', '文艺文化', '基本不看'] },
    { q: '我更喜欢哪种运动？', o: ['跑步走路', '球类', '游泳', '不太运动'] },
    { q: '遇到不公平的事，我会？', o: ['当场说出来', '事后想办法', '忍了但记着', '算了不重要'] },
    { q: '我更喜欢什么样的房间？', o: ['东西少但精致', '满满生活痕迹', '有很多绿植', '极简到空旷'] },
    { q: '我更愿意当？', o: ['领导者', '技术核心', '自由创作者', '幕后支持'] },
    { q: '我最难做到？', o: ['早睡', '不拖延', '少看手机', '控制情绪'] },
    { q: '人和人之间最重要的是？', o: ['真诚', '边界感', '共同话题', '能一起扛事'] },
    { q: '我给自己的性格打？', o: ['偏内向', '偏外向', '中间但看场合', '很难说'] }
  ];
  var TOTAL = 10;

  var $ = function (id) { return document.getElementById(id); };

  /* ---- 种子伪随机 ---- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pickIdx(seed) {
    var r = rng(seed), pool = [];
    for (var i = 0; i < BANK.length; i++) pool.push(i);
    for (var k = pool.length - 1; k > 0; k--) {
      var j = Math.floor(r() * (k + 1)), t = pool[k];
      pool[k] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, TOTAL);
  }
  function encAnswers(a) { return a.map(function (n) { return n.toString(36); }).join(''); }
  function decAnswers(s) { return String(s || '').split('').map(function (c) { return parseInt(c, 36); }); }

  /* ---- 状态 ---- */
  var mode = 'create', seed = 0, idxList = [], myAns = [], target = null, cur = 0, pending = null, hitSoFar = 0;

  /* ==========================================================
     建树
     ========================================================== */
  var NS = 'http://www.w3.org/2000/svg';
  function buildTree() {
    var g0 = $('tiers');
    g0.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) {
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'tier-g dim');
      g.dataset.i = i;
      var topY = 46 + i * 19;
      var halfW = 17 + i * 8.4;
      var h = 28;
      var tri = document.createElementNS(NS, 'polygon');
      tri.setAttribute('class', 'foliage');
      tri.setAttribute('points', (100) + ',' + topY + ' ' + (100 - halfW) + ',' + (topY + h) + ' ' + (100 + halfW) + ',' + (topY + h));
      tri.setAttribute('fill', '#248F63');
      tri.setAttribute('stroke', '#1B6E4E');
      tri.setAttribute('stroke-width', '1');
      tri.setAttribute('stroke-linejoin', 'round');
      g.appendChild(tri);
      var cols = ['#E8423F', '#FFD34D', '#7FD1AE', '#F08A5D'];
      var cnt = 2 + (i % 2);
      for (var k = 0; k < cnt; k++) {
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'orn');
        c.setAttribute('cx', (100 + (k - (cnt - 1) / 2) * halfW * 0.86).toFixed(1));
        c.setAttribute('cy', (topY + h * (0.56 + (k % 2) * 0.26)).toFixed(1));
        c.setAttribute('r', '2.9');
        c.setAttribute('fill', cols[(i + k) % cols.length]);
        g.appendChild(c);
      }
      g0.appendChild(g);
    }
  }

  function climb(n) {
    var gs = $('tiers').children;
    for (var i = 0; i < gs.length; i++) {
      var lit = i >= (TOTAL - n);
      gs[i].classList.toggle('lit', lit);
      gs[i].classList.toggle('dim', !lit);
    }
    var h = $('treeWrap').clientHeight;
    $('climber').style.bottom = Math.round((n / TOTAL) * (h - 42)) + 'px';
    $('starTop').classList.toggle('on', n >= TOTAL);
    $('scoreChip').hidden = false;
    $('scoreChip').textContent = '已爬 ' + n + ' / ' + TOTAL;
    if (n >= TOTAL) $('climber').textContent = '🎅';
  }

  /* ==========================================================
     开场
     ========================================================== */
  function boot() {
    var p = new URLSearchParams(location.search);
    var s = p.get('s'), a = p.get('a');
    if (s && a) {
      mode = 'answer';
      seed = parseInt(s, 36) || 1;
      idxList = pickIdx(seed);
      target = decAnswers(a);
      myAns = new Array(TOTAL).fill(null);
      $('boot').classList.add('hide');
      $('title').textContent = '默契度大挑战';
      setTimeout(function () { $('boot').hidden = true; startQuiz(); }, 300);
    } else {
      mode = 'create';
      $('btnCreate').addEventListener('click', function () {
        seed = Math.floor(Math.random() * 1e9);
        idxList = pickIdx(seed);
        myAns = new Array(TOTAL).fill(null);
        $('boot').classList.add('hide');
        setTimeout(function () { $('boot').hidden = true; startQuiz(); }, 300);
      });
    }
  }

  /* ==========================================================
     答题
     ========================================================== */
  function startQuiz() {
    cur = 0; hitSoFar = 0;
    $('card').hidden = false;
    renderQ();
  }

  function renderQ() {
    pending = myAns[cur];
    var it = BANK[idxList[cur]];
    var done = (mode === 'answer') ? cur : cur;   /* 进度条：create 看已答，answer 看已爬 */
    $('card').innerHTML =
      '<div class="qhead">' +
        '<span class="badge">' + (cur + 1) + ' / ' + TOTAL + '</span>' +
        '<span class="bar"><i id="bar" style="width:' + (mode === 'answer' ? (hitSoFar / TOTAL * 100) : (cur / TOTAL * 100)) + '%"></i></span>' +
      '</div>' +
      '<div class="qtext">' + esc(it.q) + '</div>' +
      '<div class="opts" id="opts"></div>' +
      '<div class="row"><button class="btn" id="next" disabled>' +
        (cur === TOTAL - 1 ? (mode === 'create' ? '完成，生成链接' : '完成，看默契度') : '下一题') +
      '</button></div>';

    var box = $('opts');
    it.o.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'opt' + (pending === i ? ' sel' : '');
      b.type = 'button';
      b.textContent = t;
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        pending = i;
        $('next').disabled = false;
      });
      box.appendChild(b);
    });
    $('next').disabled = (pending === null);
    $('next').addEventListener('click', onNext);
  }

  function onNext() {
    if (pending !== null) myAns[cur] = pending;
    if (myAns[cur] === null) return;

    /* answer 模式：实时反馈 + 爬树 */
    if (mode === 'answer') {
      var correct = (myAns[cur] === target[cur]);
      var box = $('opts');
      Array.prototype.forEach.call(box.children, function (b, i) {
        b.disabled = true;
        if (i === target[cur]) b.classList.add('ok');
        else if (i === myAns[cur]) b.classList.add('no');
      });
      if (correct) { hitSoFar++; climb(hitSoFar); }
      $('next').disabled = true;
      var btn = $('next');
      btn.textContent = '继续';
      btn.disabled = false;
      btn.onclick = function () {
        if (cur < TOTAL - 1) { cur++; renderQ(); }
        else showScore();
      };
      return;
    }

    /* create 模式：直接下一题 */
    if (cur < TOTAL - 1) { cur++; renderQ(); }
    else showShare();
  }

  /* ==========================================================
     出题：生成链接
     ========================================================== */
  function showShare() {
    climb(0);
    var url = location.origin + location.pathname + '?s=' + seed.toString(36) + '&a=' + encAnswers(myAns);
    $('title').textContent = '出题完成';
    $('card').innerHTML =
      '<div class="result">' +
        '<div class="qv" style="font-size:17px;font-weight:800;color:#1B2540;margin-bottom:4px">出题完成 🎉</div>' +
        '<div class="lvd">把链接发给朋友，让他们猜猜你的答案<br>答完就知道你们有多默契</div>' +
        '<div class="share-box">' +
          '<p>分享链接：</p>' +
          '<textarea class="share-url" id="shareUrl" readonly></textarea>' +
          '<div class="row"><button class="btn" id="copyBtn">复制链接</button>' +
          '<button class="btn ghost" id="previewBtn">我先试一遍</button></div>' +
          '<div class="copy-tip" id="copyTip"></div>' +
        '</div>' +
        '<div class="lvd" style="margin-top:9px;font-size:11.5px">🔒 链接里只有题号种子和你的答案，不含任何个人信息</div>' +
      '</div>';
    $('shareUrl').value = url;

    $('copyBtn').addEventListener('click', function () {
      var ta = $('shareUrl'); ta.select(); ta.setSelectionRange(0, 99999);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
      $('copyTip').textContent = ok ? '✅ 已复制' : '请长按上面手动复制';
      setTimeout(function () { $('copyTip').textContent = ''; }, 2600);
    });
    $('previewBtn').addEventListener('click', function () { location.href = url; });
  }

  /* ==========================================================
     答题：结局
     ========================================================== */
  function showScore() {
    var hit = 0, rows = '';
    for (var i = 0; i < TOTAL; i++) {
      var it = BANK[idxList[i]];
      var ok = (myAns[i] === target[i]);
      if (ok) hit++;
      rows += '<div class="rv"><div class="m">' + (ok ? '✅' : '❌') + '</div><div class="t"><b>' + esc(it.q) + '</b>'
        + '<span>对方选「' + esc(it.o[target[i]]) + '」' + (ok ? '' : '，你选「' + esc(it.o[myAns[i]]) + '」') + '</span></div></div>';
    }
    var pct = Math.round(hit / TOTAL * 100);
    var lv, desc;
    if (pct === 100) { lv = '👑 心有灵犀'; desc = '全部猜中。这不是默契，这是读心术。'; }
    else if (pct >= 80) { lv = '💚 非常默契'; desc = '很了解我了，剩下几道算保留一点神秘感。'; }
    else if (pct >= 60) { lv = '🌿 挺合得来'; desc = '大方向都对，细节上还有得聊。'; }
    else if (pct >= 40) { lv = '🌤 需要多聊聊'; desc = '一半一半，说明还没互相交底。'; }
    else if (pct >= 20) { lv = '🌱 还在认识'; desc = '刚开始，多问几句会好很多。'; }
    else { lv = '❄️ 完全没猜中'; desc = '……你们确定认识吗？'; }

    $('title').textContent = '默契度 ' + pct + '%';
    $('card').innerHTML =
      '<div class="result">' +
        '<div class="pct">' + pct + '<small>%</small></div>' +
        '<div class="lv">' + lv + '</div>' +
        '<div class="lvd">' + desc + '<br>爬了 <b>' + hit + '</b> / ' + TOTAL + ' 层</div>' +
        '<div class="review">' + rows + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn" id="again">再来一次</button>' +
        '<button class="btn ghost" id="mine">我也出题</button></div>' +
      '</div>';
    $('again').addEventListener('click', function () { location.reload(); });
    $('mine').addEventListener('click', function () { location.href = location.pathname; });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ==========================================================
     背景：星空 + 雪 + 雪花（六角 SVG）
     ========================================================== */
  var sky = $('sky'), snow = $('snow');
  var sctx = sky.getContext('2d'), wctx = snow.getContext('2d');
  var stars = [], flakes = [];

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    [sky, snow].forEach(function (c) {
      c.width = innerWidth * dpr; c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    stars = [];
    for (var i = 0; i < 75; i++) stars.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * .62,
      r: Math.random() * 1.7 + .4, p: Math.random() * 6.283, s: Math.random() * .02 + .008 });
    flakes = [];
    for (var j = 0; j < 50; j++) flakes.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 1.9 + .7, vy: Math.random() * .5 + .2, vx: (Math.random() - .5) * .26, a: Math.random() * .45 + .25 });
  }

  function loop() {
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i]; s.p += s.s;
      sctx.globalAlpha = .28 + Math.abs(Math.sin(s.p)) * .72;
      sctx.fillStyle = '#fff';
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
    }
    sctx.globalAlpha = 1;
    wctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var j = 0; j < flakes.length; j++) {
      var f = flakes[j]; f.y += f.vy; f.x += f.vx;
      if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
      if (f.x < -5) f.x = innerWidth + 5;
      if (f.x > innerWidth + 5) f.x = -5;
      wctx.globalAlpha = f.a; wctx.fillStyle = '#fff';
      wctx.beginPath(); wctx.arc(f.x, f.y, f.r, 0, 6.283); wctx.fill();
    }
    wctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  function makeFlakes() {
    for (var i = 0; i < 7; i++) {
      var d = document.createElement('div');
      d.className = 'flake';
      var sz = 13 + Math.random() * 22;
      var arms = '';
      for (var k = 0; k < 6; k++) {
        var a = (k * 60) * Math.PI / 180;
        var x2 = 50 + Math.cos(a) * 44, y2 = 50 + Math.sin(a) * 44;
        var bx = 50 + Math.cos(a) * 25, by = 50 + Math.sin(a) * 25;
        arms += '<line x1="50" y1="50" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>'
              + '<line x1="' + bx.toFixed(1) + '" y1="' + by.toFixed(1) + '" x2="' + (bx + Math.cos(a - .5) * 13).toFixed(1) + '" y2="' + (by + Math.sin(a - .5) * 13).toFixed(1) + '"/>'
              + '<line x1="' + bx.toFixed(1) + '" y1="' + by.toFixed(1) + '" x2="' + (bx + Math.cos(a + .5) * 13).toFixed(1) + '" y2="' + (by + Math.sin(a + .5) * 13).toFixed(1) + '"/>';
      }
      d.innerHTML = '<svg viewBox="0 0 100 100" width="' + sz + '" height="' + sz +
        '" fill="none" stroke="#DDEBFF" stroke-width="2.6" stroke-linecap="round" opacity=".55">' + arms + '</svg>';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.animationDuration = (15 + Math.random() * 17) + 's';
      d.style.animationDelay = (-Math.random() * 26) + 's';
      document.body.appendChild(d);
    }
  }

  /* ==========================================================
     启动
     ========================================================== */
  buildTree();
  climb(0);
  resize();
  makeFlakes();
  requestAnimationFrame(loop);
  addEventListener('resize', function () { resize(); climb(mode === 'answer' ? hitSoFar : 0); });
  boot();
})();
</script>
</body>
</html>
