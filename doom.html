<meta property="og:image" content="https://hosimiyashoyo.github.io/astrazhou/assets/og-cover.jpg">

<style>
  .dos-wrap { margin: 1.3rem 0 0; }
  #dos {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 26px rgba(20, 40, 4, .22);
    touch-action: none;
  }

  .dos-status {
    margin-top: .7rem; padding: .7rem .9rem; border-radius: 10px;
    font-size: .88rem; line-height: 1.7;
    background: var(--glass-bg-2); border: 1px solid var(--glass-border);
    color: var(--muted);
  }
  .dos-status b { color: var(--fg); }

  .dos-pad { margin-top: 1rem; user-select: none; -webkit-user-select: none; }
  .dos-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .dos-grid { display: grid; gap: .4rem; justify-items: center; }
  .dos-line { display: flex; gap: .4rem; }
  .dk {
    font: inherit; font-size: 1rem; font-weight: 700;
    width: 3.2rem; height: 3.2rem; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--fg); background: var(--glass-bg-2);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 6px 16px rgba(40, 68, 8, .16);
    -webkit-backdrop-filter: var(--blur-2); backdrop-filter: var(--blur-2);
    cursor: pointer; touch-action: none;
    transition: color .15s, border-color .15s, transform .15s;
  }
  .dk.on, .dk:active { color: var(--accent); border-color: var(--accent); transform: scale(.95); }
  .dk.wide { width: 4.6rem; }
  .dk.fire { width: 4.6rem; height: 4.6rem; border-radius: 50%; border-color: var(--accent); color: var(--accent); font-size: .9rem; }
  .dos-tip { font-size: .82rem; color: var(--muted); line-height: 1.75; margin-top: .9rem; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="back-home" href="index.html" aria-label="返回主页">←</a>
    <a class="brand" href="index.html"><img class="avatar" src="assets/avatar.jpg" alt="" width="30" height="30">Astra Zhou’s Blog</a>
    <img class="brand-mac" src="assets/mac-smile.png" alt="" style="width:20px;height:auto;flex:none;margin-left:.45rem;opacity:.9">
  </header>

  <main>
    <h1>DOOM</h1>
    <p class="lead">1993 年原版共享版，跑在浏览器的 DOS 模拟器里。</p>

    <div class="dos-wrap">
      <canvas id="dos" width="640" height="400"></canvas>

      <div class="dos-status" id="status">正在加载 DOS 模拟器…（首次打开要下载约 2 MB）</div>

      <div class="dos-pad">
        <div class="dos-row">
          <div class="dos-grid">
            <button class="dk" data-k="up" type="button">W</button>
            <div class="dos-line">
              <button class="dk" data-k="left" type="button">A</button>
              <button class="dk" data-k="down" type="button">S</button>
              <button class="dk" data-k="right" type="button">D</button>
            </div>
          </div>
          <div class="dos-grid">
            <button class="dk wide" data-k="use" type="button">开门</button>
            <button class="dk fire" data-k="fire" type="button">开火</button>
          </div>
        </div>
      </div>

      <p class="dos-tip">
        手机：<b>在画面上左右滑动</b>转身，W 前进 / S 后退 / A 左移 / D 右移，右下角开火，中间那个开门（对着门按）。<br>
        电脑：直接按 <b>方向键</b>（← → 转身，↑ ↓ 前后）、<b>Ctrl</b> 开火、<b>空格</b> 开门；也能用鼠标在画面上拖动转身。<br>
        首次打开要等 DOS 模拟器加载几秒；进游戏后如果没声音是正常的（没加载音效卡）。
      </p>
    </div>
  </main>

  <footer class="site">© <span id="y">2025</span> Astra Zhou</footer>

</div>

<script src="https://js-dos.com/6.22/current/js-dos.js"></script>
<script>
document.getElementById('y').textContent = new Date().getFullYear();

(function () {
  'use strict';
  var host = document.getElementById('dos');   /* 这是 canvas 本身 */
  var status = document.getElementById('status');
  if (!host || typeof Dos !== 'function') {
    if (status) status.innerHTML = '<b>DOS 模拟器没加载出来</b>（可能是网络问题），刷新重试一次。';
    return;
  }

  var keys = {};

  function kd(code, down) {
    /* 同时派发到 document 和 canvas，DOSBox 监听哪一个都能收到 */
    var ev;
    try {
      ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
        key: code === 17 ? 'Control' : code === 32 ? ' ' : String.fromCharCode(code),
        keyCode: code, which: code, bubbles: true, cancelable: true
      });
    } catch (e) { return; }
    document.dispatchEvent(ev);
    host.dispatchEvent(ev);
  }

  var MAP = { up: 38, down: 40, left: 37, right: 39, fire: 17, use: 32 };

  Dos(host, {
    wdosboxUrl: 'https://js-dos.com/6.22/current/wdosbox.js',
    cycles: 'auto',
    autolock: true,
    scale: 'aspect'
  }).ready(function (fs, main) {
    status.innerHTML = '正在解压 DOOM 游戏文件…';
    fs.extract('assets/games/doom.zip').then(function () {
      status.innerHTML = '正在启动 DOOM…';
      /* -warp 1 1 = 直接开始第一关，省掉在 DOS 菜单里选 */
      main(['-c', 'DOOM.EXE -warp 1 1']);
      setTimeout(function () {
        status.innerHTML = 'DOOM 已在运行。手机：<b>滑动画面转身</b> + 下方按钮；电脑：方向键 + Ctrl 开火 + 空格开门。';
      }, 6000);
    }).catch(function (err) {
      status.innerHTML = '<b>游戏文件解压失败：</b>' + (err && err.message ? err.message : err) + '。刷新重试。';
    });
  }).catch(function (err) {
    status.innerHTML = '<b>DOS 模拟器启动失败：</b>' + (err && err.message ? err.message : err) + '。刷新重试。';
  });

  /* 画面滑动 = 左右转向（按住左右方向键） */
  var dragX = null, dragging = false;
  function turn(dir) {
    kd(39, false); kd(37, false);
    if (dir > 0) kd(39, true); else if (dir < 0) kd(37, true);
  }
  host.addEventListener('touchstart', function (e) {
    dragX = e.touches[0].clientX; dragging = true; e.preventDefault();
  }, { passive: false });
  host.addEventListener('touchmove', function (e) {
    if (dragX === null) return;
    var x = e.touches[0].clientX, d = x - dragX;
    if (Math.abs(d) > 12) { turn(d); dragX = x; }
    e.preventDefault();
  }, { passive: false });
  host.addEventListener('touchend', function () {
    dragX = null; dragging = false; kd(37, false); kd(39, false);
  });

  var mDown = false, mX = 0;
  host.addEventListener('mousedown', function (e) { mDown = true; mX = e.clientX; });
  window.addEventListener('mousemove', function (e) {
    if (!mDown) return;
    var d = e.clientX - mX;
    if (Math.abs(d) > 12) { turn(d); mX = e.clientX; }
  });
  window.addEventListener('mouseup', function () { mDown = false; kd(37, false); kd(39, false); });

  /* 虚拟按键 */
  var btns = [].slice.call(document.querySelectorAll('[data-k]'));
  btns.forEach(function (b) {
    var name = b.getAttribute('data-k');
    var code = MAP[name];
    if (!code) return;
    var on = function (e) { e.preventDefault(); if (!keys[name]) { keys[name] = 1; kd(code, true); b.classList.add('on'); } };
    var off = function (e) { if (e) e.preventDefault(); if (keys[name]) { keys[name] = 0; kd(code, false); b.classList.remove('on'); } };
    b.addEventListener('touchstart', on, { passive: false });
    b.addEventListener('touchend', off, { passive: false });
    b.addEventListener('touchcancel', off, { passive: false });
    b.addEventListener('mousedown', on);
    b.addEventListener('mouseup', off);
    b.addEventListener('mouseleave', off);
  });

  /* 键盘直通（电脑上直接玩） */
  window.addEventListener('keydown', function (e) {
    if ([37,38,39,40,17,32].indexOf(e.keyCode) >= 0) e.preventDefault();
  }, { passive: false });
})();
</script>
<script>
/* 打开站内页面时自动带时间戳，避开浏览器与 CDN 的 10 分钟缓存。
   这样你每次点“文章”看到的都是最新列表，不会再有“刚发的文章看不到”。 */
(function () {
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el.tagName !== 'A') el = el.parentNode;
    if (!el || !el.getAttribute) return;
    var href = el.getAttribute('href');
    if (!href) return;
    if (/^(https?:|mailto:|tel:|#|\/\/)/.test(href)) return;   /* 外链、锚点不管 */
    if (!/\.html($|\?)/.test(href)) return;                     /* 只处理页面链接 */
    if (/[?&]_=/.test(href)) return;                             /* 已经带过就别重复 */
    var sep = href.indexOf('?') >= 0 ? '&' : '?';
    e.preventDefault();
    location.href = href + sep + '_=' + Date.now();
  }, true);
})();
</script>
</body>
</html>
