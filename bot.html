<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="description" content="中国计量大学校园问答 · 本地知识库 + AI">
<title>计量小助手 · Astra Zhou</title>
<meta property="og:type" content="website">
<meta property="og:title" content="计量小助手 · 中国计量大学校园问答">
<meta property="og:description" content="校园卡、宿舍、选课、考试、食堂、图书馆……问就完了。">
<meta property="og:image" content="https://astrazhou.is-cool.dev/assets/og-cover.jpg">
<meta property="og:url" content="https://astrazhou.is-cool.dev/bot.html">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css?v=1794375892">
<link rel="stylesheet" href="assets/bot/bot.css?v=1794375892">
<style>
/* ==========================================================
   薄荷绿主题 v2 —— 重点解决"文字看不清"
   思路：玻璃半透明只用在容器边缘，文字实际承载层用接近不透明的白
   ========================================================== */
:root {
  --ink: #0b1204;                 /* 正文更深，压住背景 */
  --ink-soft: #35421f;
  --ink-faint: #5c6a44;
  --line: rgba(77, 124, 15, .26);
  --bg: transparent;
  --surface: rgba(255, 255, 255, .82);
  --brand: #4d7c0f;
  --brand-deep: #3a5f0b;
  --brand-soft: rgba(255, 255, 255, .78);
  --radius: var(--radius-md, 14px);
  --shadow: 0 18px 46px rgba(38, 62, 8, .22), 0 1px 3px rgba(38, 62, 8, .09);
}

html, body { height: auto; min-height: 100dvh; }
body {
  display: flex;
  flex-direction: column;
  background: transparent;
  color: #0b1204;
}
body > header.bot-header { flex: none; }

/* 整个对话区包一层高不透明度的玻璃，保证文字有干净的浅底 */
body > .shell {
  flex: 1 1 auto;
  min-height: 0;
  height: auto;
  background: rgba(255, 255, 255, .78);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  backdrop-filter: blur(24px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, .70);
  border-radius: var(--radius, 14px);
  box-shadow: 0 18px 46px rgba(38, 62, 8, .20), inset 0 1px 0 rgba(255,255,255,.85);
  margin-bottom: 1rem;
  overflow: hidden;
}
header.bot-header {
  padding-left: clamp(1rem, 4vw, 2rem);
  padding-right: clamp(1rem, 4vw, 2rem);
}

/* 顶栏：中等透明，仍有玻璃感 */
.shell .topbar {
  background: rgba(255, 255, 255, .55);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
  border-bottom: 1px solid rgba(77, 124, 15, .20);
}
.shell .mark { color: #4d7c0f; }
.shell .brand-text h1 { color: #0b1204; }
.shell .brand-text .sub { color: #43502c; }

/* ===== 消息气泡：这是对比度问题的核心 ===== */
/* 助手气泡：接近纯白，深色字 */
.shell .msg.bot .bubble,
.shell .bubble {
  background: rgba(255, 255, 255, .94);
  color: #0b1204;
  border: 1px solid rgba(77, 124, 15, .18);
  box-shadow: 0 2px 10px rgba(38, 62, 8, .08);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 用户气泡：实心橄榄绿 + 白字，一眼分清 */
.shell .msg.user .bubble {
  background: #4d7c0f;
  color: #ffffff;
  border: 1px solid #3a5f0b;
  box-shadow: 0 2px 10px rgba(58, 95, 11, .22);
}
.shell .msg.user .bubble * { color: #ffffff; }

/* 开场区文字 */
.shell .intro h2 { color: #0b1204; }
.shell .intro-lead { color: #35421f; }

/* 快捷问题胶囊：白底深字，hover 变绿边 */
.shell .chip,
.shell .suggest button,
.shell .pill {
  background: rgba(255, 255, 255, .90);
  color: #24300f;
  border: 1px solid rgba(77, 124, 15, .30);
  box-shadow: 0 1px 4px rgba(38, 62, 8, .08);
}
.shell .chip:hover,
.shell .suggest button:hover {
  color: #3a5f0b;
  border-color: #4d7c0f;
  background: #fff;
}

/* 输入框：白底，明显边框 */
.shell textarea,
.shell input[type="text"],
.shell input[type="search"],
.shell .composer,
.shell .form,
.shell .inputbar {
  background: rgba(255, 255, 255, .92) !important;
  color: #0b1204 !important;
  border: 1px solid rgba(77, 124, 15, .28);
  box-shadow: inset 0 1px 2px rgba(38, 62, 8, .06);
}
.shell textarea::placeholder,
.shell input::placeholder { color: #7b8a63; }

/* 发送按钮：实心绿 */
.shell .send,
.shell button[type="submit"] {
  background: #4d7c0f;
  color: #fff;
  border: none;
}
.shell button { color: #24300f; }
.shell .icon-btn { color: #35421f; }
.shell .icon-btn:hover { color: #4d7c0f; }
.shell a, .shell .linklike { color: #3a5f0b; }

/* 让正文继承深色 */
.shell, .shell p, .shell div, .shell span, .shell li { color: inherit; }
.shell { color: #0b1204; }

/* 滚动条 */
.shell ::-webkit-scrollbar-thumb {
  background: rgba(77, 124, 15, .26);
  border-radius: 999px;
}

/* ========== 修复：标题竖排 + 页头文字看不见 ========== */
/* 1) 标题一行显示，不许被挤成竖排 */
.shell .brand,
.shell .brand-text,
.shell .brand-text h1,
.shell .brand-text .sub,
.shell .topbar .brand-text h1 {
  white-space: nowrap;
}
.shell .brand-text { min-width: 0; flex: 1 1 auto; }
.shell .brand-text h1 {
  font-size: clamp(15px, 4.2vw, 19px);   /* 手机上略缩，放得下 */
  letter-spacing: 0;
}

/* 2) 页头文字改成浅色 —— 它在深色 Aurora 背景上，不在白卡里 */
header.bot-header,
header.bot-header .brand,
header.bot-header .brand .avatar {
  color: #eafff5;
}
header.bot-header .back-home {
  color: #dff5e9;
  background: rgba(255, 255, 255, .16);
  border-color: rgba(255, 255, 255, .34);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 4px 14px rgba(0, 0, 0, .18);
}
header.bot-header .back-home:hover {
  color: #ffffff;
  border-color: #6ee7b7;
}
header.bot-header .brand-mac { opacity: .95; }

/* 3) 顶栏里的图标按钮也保证可见 */
.shell .icon-btn {
  color: #35421f;
  background: rgba(255, 255, 255, .85);
  border: 1px solid rgba(77, 124, 15, .28);
}


  /* 校徽图片：圆形、自适应父容器 */
  /* 校徽：容器定死尺寸，避免 width:100% 失控 */
  .shell .mark {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
  }
  .shell .mark .school-logo {
    display: block;
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 50%;
  }
  /* 窄屏稍微缩小，避免和下拉框抢位置 */
  @media (max-width: 420px) {
    .shell .mark,
    .shell .mark .school-logo { width: 34px; height: 34px; }
  }

  /* 引擎切换提示：淡黄底 + 深字，滚到哪都看得见 */
  .shell .disclaimer.engine-tip {
    margin-top: .35rem;
    padding: .45rem .7rem;
    border-radius: var(--radius-sm, 9px);
    background: rgba(232, 167, 44, .14);
    border: 1px solid rgba(232, 167, 44, .38);
    color: #5b3f06;
    line-height: 1.6;
  }
  .shell .disclaimer.engine-tip strong { color: #8a5a00; }
</style>




</head>
<body>
<header class="site bot-header">
<a class="back-home" href="index.html" aria-label="返回主页">←</a>
<a class="brand" href="index.html"><img class="avatar" src="assets/avatar.jpg" alt="" width="30" height="30">Astra Zhou’s Blog</a>
<img class="brand-mac" src="assets/mac-smile.png" alt="" style="width:20px;height:auto;flex:none;margin-left:.45rem;opacity:.9">
</header>



<div class="shell" id="shell">

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
<img class="school-logo" src="assets/bot/cjlu-logo.png" alt="中国计量大学校徽" width="40" height="40" decoding="async">
      </div>
      <div class="brand-text">
        <h1>计量小助手</h1>
        <p class="sub">中国计量大学 · 校园问答</p>
      </div>
    </div>

    <div class="meta">
      <span class="chip" id="kb-stat">知识库加载中</span>
      <select class="chip" id="sel-provider" title="切换模型（本地演示时用免费的那家）"></select>
      <button class="icon-btn" id="btn-sources" title="查看检索到的引用来源" aria-label="引用来源">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v13.5"/>
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/>
          <path d="M9 7h6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-clear" title="清空对话" aria-label="清空对话">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 14H6L5 6"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat">
    <section class="intro" id="intro">
      <h2>问点什么吧</h2>
      <p class="intro-lead">我只管中国计量大学的事。校园卡、宿舍、选课、考试、食堂、图书馆……问就完了。</p>
      <div class="suggest" id="suggest">
        <button class="suggest-btn">校园卡丢了怎么办</button>
        <button class="suggest-btn">学校有什么特色专业</button>
        <button class="suggest-btn">怎么连校园网</button>
        <button class="suggest-btn">挂科了要重修吗</button>
        <button class="suggest-btn">快递在哪儿取</button>
        <button class="suggest-btn">保研需要什么条件</button>
      </div>
      <p class="intro-foot">
        <span class="dot"></span>答案来自本地知识库，不是联网搜索
      </p>
    </section>
  </main>

  <footer class="composer">
    <div class="kb-toggle">
      <label class="switch">
        <input type="checkbox" id="chk-kb" checked>
        <span class="slider"></span>
      </label>
      <span class="kb-label">使用知识库</span>
    </div>
    <form class="input-row" id="form">
      <textarea id="input" rows="1" placeholder="问点学校的事儿，回车发送，Shift+回车换行" autocomplete="off" spellcheck="false"></textarea>
      <button type="submit" id="send" class="send-btn" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">回答由 AI 生成，涉及学分、时间、金额等具体信息请以学校官方通知为准。</p>
    <p class="disclaimer engine-tip"><strong>OpenRouter 模型报错时</strong>（免费池每日额度用尽），请点上方下拉框切换到 <strong>DeepSeek</strong>。</p>
  </footer>

</div>

<!-- 引用来源抽屉 -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>检索到的资料</h3>
    <button class="icon-btn" id="btn-drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <p class="empty">还没有提问，暂时没有引用来源。</p>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<!-- 消息模板 -->
<template id="tpl-msg">
  <article class="msg">
    <div class="avatar" aria-hidden="true"></div>
    <div class="bubble"></div>
  </article>
</template>


<script src="assets/bot/kb.js?v=1794375892"></script>
<script src="assets/bot/keys.js?v=1794375892"></script>
<script src="assets/bot/engine.js?v=1794375892"></script>
</body>
</html>
