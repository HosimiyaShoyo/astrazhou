<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="description" content="中国计量大学校园问答 · 本地知识库 + AI">
<title>计量小帮手 · Astra Zhou</title>
<meta property="og:type" content="website">
<meta property="og:title" content="计量小帮手 · 中国计量大学校园问答">
<meta property="og:description" content="校园卡、宿舍、选课、考试、食堂、图书馆……问就完了。">
<meta property="og:image" content="https://astrazhou.is-cool.dev/assets/og-cover.jpg">
<meta property="og:url" content="https://astrazhou.is-cool.dev/bot.html">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css?v=1794374817">
<link rel="stylesheet" href="assets/bot/bot.css?v=1794374817">
<style>
/* ==========================================================
   薄荷绿液态玻璃主题 —— 覆盖 bot.css 里原来的浅蓝白配色
   只改变量 + 少量硬编码色，不动任何布局与逻辑
   ========================================================== */
:root {
  --ink: #141c0b;
  --ink-soft: #43502c;
  --ink-faint: #6d7a55;
  --line: rgba(77, 124, 15, .24);
  --bg: transparent;                       /* 让博客的 Aurora 壁纸透出来 */
  --surface: var(--glass-bg-2, rgba(255,255,255,.50));
  --brand: #4d7c0f;
  --brand-deep: #3a5f0b;
  --brand-soft: rgba(255, 255, 255, .46);
  --radius: var(--radius-md, 14px);
  --shadow: 0 18px 46px rgba(38, 62, 8, .18), 0 1px 3px rgba(38, 62, 8, .07);
}

/* 让整个页面用博客的 Aurora 壁纸 */
html, body {
  height: auto;
  min-height: 100dvh;
}
body {
  display: flex;
  flex-direction: column;
  background: transparent;
}
body > header.bot-header { flex: none; }
body > .shell {
  flex: 1 1 auto;
  min-height: 0;
  height: auto;
}

/* 页头留白与博客统一 */
header.bot-header {
  padding-left: clamp(1rem, 4vw, 2rem);
  padding-right: clamp(1rem, 4vw, 2rem);
}

/* ---------- 顶栏 / 卡片：液态玻璃 ---------- */
.shell .topbar {
  background: var(--glass-bg, rgba(255,255,255,.38));
  -webkit-backdrop-filter: var(--blur, blur(20px) saturate(160%));
  backdrop-filter: var(--blur, blur(20px) saturate(160%));
  border-bottom: 1px solid var(--glass-border, rgba(255,255,255,.60));
  box-shadow: 0 1px 0 var(--glass-hi, rgba(255,255,255,.78)) inset;
}
.shell .mark { color: var(--accent, #4d7c0f); }

/* 输入区玻璃 */
.shell .composer,
.shell .form,
.shell .inputbar {
  background: var(--glass-bg-2, rgba(255,255,255,.50));
  -webkit-backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  border: 1px solid var(--glass-border, rgba(255,255,255,.60));
  box-shadow: inset 0 1px 0 var(--glass-hi, rgba(255,255,255,.78)), 0 8px 22px rgba(38,62,8,.10);
}

/* chip / 快捷问题：玻璃小胶囊 */
.shell .chip,
.shell .suggest button,
.shell .pill {
  background: var(--glass-bg-2, rgba(255,255,255,.50));
  -webkit-backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  border: 1px solid var(--glass-border, rgba(255,255,255,.60));
  color: var(--muted, #43502c);
}
.shell .chip:hover,
.shell .suggest button:hover {
  color: var(--accent, #4d7c0f);
  border-color: var(--accent, #4d7c0f);
}

/* 按钮统一用博客的橄榄绿 */
.shell button,
.shell .send,
.shell .icon-btn {
  color: var(--fg, #141c0b);
}
.shell .send,
.shell button[type="submit"] {
  background: var(--accent, #4d7c0f);
  color: #fff;
}

/* 用户气泡 / 助手气泡 */
.shell .msg.user .bubble {
  background: rgba(77, 124, 15, .14);
  color: var(--fg, #141c0b);
  border: 1px solid rgba(77, 124, 15, .22);
}
.shell .msg.bot .bubble {
  background: var(--glass-bg-2, rgba(255,255,255,.50));
  -webkit-backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  backdrop-filter: var(--blur-2, blur(10px) saturate(150%));
  border: 1px solid var(--glass-border, rgba(255,255,255,.60));
  color: var(--fg, #141c0b);
}

/* 把残留的深蓝品牌色纠正成橄榄绿 */
.shell a { color: var(--accent, #4d7c0f); }
.shell .linklike { color: var(--accent, #4d7c0f); }

/* 滚动条淡一点 */
.shell ::-webkit-scrollbar-thumb {
  background: rgba(77, 124, 15, .22);
  border-radius: 999px;
}
</style>



</head>
<body>
<header class="site bot-header">
<a class="back-home" href="index.html" aria-label="返回主页">←</a>
<a class="brand" href="index.html"><img class="avatar" src="assets/avatar.jpg" alt="" width="30" height="30">Astra Zhou’s Blog</a>
<img class="brand-mac" src="assets/mac-smile.png" alt="" style="width:20px;height:auto;flex:none;margin-left:.45rem;opacity:.9">
</header>



<div class="shell" id="shell">

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="20" y1="2" x2="20" y2="8"/>
            <line x1="20" y1="32" x2="20" y2="38"/>
            <line x1="2" y1="20" x2="8" y2="20"/>
            <line x1="32" y1="20" x2="38" y2="20"/>
          </g>
          <circle cx="20" cy="20" r="3" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>计量小帮手</h1>
        <p class="sub">中国计量大学 · 校园问答</p>
      </div>
    </div>

    <div class="meta">
      <span class="chip" id="kb-stat">知识库加载中</span>
      <select class="chip" id="sel-provider" title="切换模型（本地演示时用免费的那家）"></select>
      <button class="icon-btn" id="btn-sources" title="查看检索到的引用来源" aria-label="引用来源">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v13.5"/>
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/>
          <path d="M9 7h6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-clear" title="清空对话" aria-label="清空对话">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 14H6L5 6"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat">
    <section class="intro" id="intro">
      <h2>问点什么吧</h2>
      <p class="intro-lead">我只管中国计量大学的事。校园卡、宿舍、选课、考试、食堂、图书馆……问就完了。</p>
      <div class="suggest" id="suggest">
        <button class="suggest-btn">校园卡丢了怎么办</button>
        <button class="suggest-btn">学校有什么特色专业</button>
        <button class="suggest-btn">怎么连校园网</button>
        <button class="suggest-btn">挂科了要重修吗</button>
        <button class="suggest-btn">快递在哪儿取</button>
        <button class="suggest-btn">保研需要什么条件</button>
      </div>
      <p class="intro-foot">
        <span class="dot"></span>答案来自本地知识库，不是联网搜索
      </p>
    </section>
  </main>

  <footer class="composer">
    <div class="kb-toggle">
      <label class="switch">
        <input type="checkbox" id="chk-kb" checked>
        <span class="slider"></span>
      </label>
      <span class="kb-label">使用知识库</span>
    </div>
    <form class="input-row" id="form">
      <textarea id="input" rows="1" placeholder="问点学校的事儿，回车发送，Shift+回车换行" autocomplete="off" spellcheck="false"></textarea>
      <button type="submit" id="send" class="send-btn" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">回答由 AI 生成，涉及学分、时间、金额等具体信息请以学校官方通知为准。</p>
  </footer>

</div>

<!-- 引用来源抽屉 -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>检索到的资料</h3>
    <button class="icon-btn" id="btn-drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <p class="empty">还没有提问，暂时没有引用来源。</p>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<!-- 消息模板 -->
<template id="tpl-msg">
  <article class="msg">
    <div class="avatar" aria-hidden="true"></div>
    <div class="bubble"></div>
  </article>
</template>


<script src="assets/bot/kb.js?v=1794374817"></script>
<script src="assets/bot/keys.js?v=1794374817"></script>
<script src="assets/bot/engine.js?v=1794374817"></script>
</body>
</html>
